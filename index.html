<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSF Durian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide (icon font style usage) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- LightGallery CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lightgallery-bundle.min.css">
    <!-- Google Font: Nokora -->
    <link href="https://fonts.googleapis.com/css2?family=Nokora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<!-- Apply Nokora globally -->
<style>
    body {
        font-family: "Nokora", sans-serif;
    }
</style>
<body class="bg-gray-100 flex items-center justify-center">

<div class="w-full max-w-lg bg-white rounded-xl shadow-md p-5">

    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-3">
            <!-- Logo -->
            <div class="w-10 h-10 rounded-lg overflow-hidden bg-gray-100 flex items-center justify-center">
                <img 
                    src="https://via.placeholder.com/40" 
                    alt="Company Logo"
                    class="w-full h-full object-cover"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >

                <!-- Fallback (Initials) -->
                <div class="hidden w-full h-full items-center justify-center text-xs font-semibold text-gray-600">
                    <img src="logo.png" alt="VSF Durian" class="object-cover">
                </div>
            </div>

            <div>
                <h2 class="text-sm font-semibold text-gray-800 leading-tight" data-i18n="company_name">
                    VSF Durian
                </h2>
                <p class="text-xs text-gray-500" data-i18n="profile">Profile</p>
            </div>
        </div>
        <!-- Language Switch -->
        <button id="langBtn" class="px-3 py-1 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 transition text-xs font-medium">
            ENGLISH
        </button>
    </div>

    <!-- Info -->
    <div class="divide-y text-sm">
        <!-- Phone -->
        <a href="tel:+85517883474" class="flex items-center justify-between py-2 hover:bg-gray-50 rounded transition">
            <div class="flex items-center space-x-2 text-gray-500">
                <i data-lucide="phone" class="w-4 h-4"></i>
                <span data-i18n="phone_label">Phone</span>
            </div>
            <span class="text-green-700 font-medium">
                +855 17 883 474
            </span>
        </a>
        <!-- Address -->
        <a href="https://maps.app.goo.gl/mAwXLzBAE3zQocLX6" target="_blank"
            class="flex items-start justify-between py-2 hover:bg-gray-50 rounded transition">
            <div class="flex items-center space-x-2 text-gray-500">
                <i data-lucide="map-pin" class="w-4 h-4 mt-0.5"></i>
                <span data-i18n="address_label">Address</span>
            </div>
            <span class="text-green-700 font-medium text-right" data-i18n="address_value">
                Phum Choan Leng, Meanchey Commune, Sandan District, Kampong Thom Province
            </span>
        </a>
    </div>

    <!-- Gallery -->
    <h2 class="text-lg font-semibold text-gray-700 mb-2 mt-4" data-i18n="gallery">Gallery</h2>
    <div id="lightgallery" class="grid grid-cols-3 gap-2">
        <a href="1.jpg" target="_blank">
            <img src="1.jpg" class="h-20 w-full object-cover rounded-md">
        </a>
        <a href="2.jpg" target="_blank">
            <img src="2.jpg" class="h-20 w-full object-cover rounded-md">
        </a>
        <a href="3.jpg" target="_blank">
            <img src="3.jpg" class="h-20 w-full object-cover rounded-md">
        </a>
        <a href="4.jpg" target="_blank">
            <img src="4.jpg" class="h-20 w-full object-cover rounded-md">
        </a>
        <a href="5.jpg" target="_blank">
            <img src="5.jpg" class="h-20 w-full object-cover rounded-md">
        </a>
        <a href="6.jpg" target="_blank">
            <img src="6.jpg" class="h-20 w-full object-cover rounded-md">
        </a>
        <a href="7.jpg" target="_blank">
            <img src="7.jpg" class="h-20 w-full object-cover rounded-md">
        </a>
        <a href="8.jpg" target="_blank">
            <img src="8.jpg" class="h-20 w-full object-cover rounded-md">
        </a>
        <a href="9.jpg" target="_blank">
            <img src="9.jpg" class="h-20 w-full object-cover rounded-md">
        </a>
    </div>

    <div class="flex items-center mt-4 justify-center">
        <a href="https://maps.app.goo.gl/mAwXLzBAE3zQocLX6" target="_blank" rel="noopener"
            class="flex items-center space-x-2 px-4 py-2 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 transition text-sm font-medium">
            <i data-lucide="map-pin" class="w-4 h-4"></i>
            <span data-i18n="farm_direction">Farm Location</span>
        </a>
    </div>

    

</div>
<!-- LightGallery JS -->
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/lightgallery.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/zoom/lg-zoom.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/thumbnail/lg-thumbnail.umd.min.js"></script>
<!-- Activate icons -->
<script>
    lucide.createIcons();
    lightGallery(document.getElementById('lightgallery'), {
            selector: 'a',
            plugins: [lgZoom, lgThumbnail],
            speed: 300,
            thumbnail: true
        });

    // Language switcher (simple toggle for demo)
    // Language data
        const translations = {
            en: {
                company_name: "VSF Agriculture",
                profile: "Profile",
                phone_label: "Phone",
                address_label: "Address",
                address_value: "Phum Choan Leng, Meanchey Commune, Sandan District, Kampong Thom Province",
                gallery: "Gallery",
                farm_direction: "Farm Location"
            },
            kh: {
                company_name: "ក្រុមហ៊ុនកសិកម្ម VSF",
                profile: "Profile",
                phone_label: "លេខទូរស័ព្ទ",
                address_label: "អាសយដ្ឋាន",
                address_value: "ភូមិជាន់លែង ឃុំមានជ័យ ស្រុកសណ្តាន់ ខេត្តកំពង់ធំ",
                gallery: "រូបភាព",
                farm_direction: "ទីតាំងកសិដ្ឋាន"
            }
        };

        let currentLang = "en";

        const langBtn = document.getElementById("langBtn");

        function switchLang(lang) {
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                el.innerText = translations[lang][key];
            });

            langBtn.innerText = lang === "en" ? "ENGLISH" : "ភាសាខ្មែរ";
        }

        langBtn.addEventListener("click", () => {
            currentLang = currentLang === "en" ? "kh" : "en";
            switchLang(currentLang);
        });
</script>
</body>
</html>
