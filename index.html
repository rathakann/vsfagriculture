<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSF Agriculture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide (icon font style usage) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center">

<div class="w-full max-w-md bg-white rounded-xl shadow-md p-5">

    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-3">

            <!-- Logo -->
            <div class="w-10 h-10 rounded-lg overflow-hidden bg-gray-100 flex items-center justify-center">
                <img 
                    src="https://via.placeholder.com/40" 
                    alt="Company Logo"
                    class="w-full h-full object-cover"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >

                <!-- Fallback (Initials) -->
                <div class="hidden w-full h-full items-center justify-center text-xs font-semibold text-gray-600">
                    <img src="logo.png" alt="VSF Agriculture Logo" class="object-cover">
                </div>
            </div>

            <div>
                <h2 class="text-sm font-semibold text-gray-800 leading-tight">
                    VSF Agriculture
                </h2>
                <p class="text-xs text-gray-500">Profile</p>
            </div>
        </div>
    </div>

    <!-- Info -->
    <div class="divide-y text-sm">
    
        <!-- Email -->
        <a href="mailto:info@VSFAgriculture.com"
            class="flex items-center justify-between py-2 hover:bg-gray-50 rounded transition">
            <div class="flex items-center space-x-2 text-gray-500">
                <i data-lucide="mail" class="w-4 h-4"></i>
                <span>Email</span>
            </div>
            <span class="text-green-700 font-medium truncate max-w-[160px]">
                info@vsf.com
            </span>
        </a>
    
        <!-- Phone -->
        <a href="tel:+85517883474" class="flex items-center justify-between py-2 hover:bg-gray-50 rounded transition">
            <div class="flex items-center space-x-2 text-gray-500">
                <i data-lucide="phone" class="w-4 h-4"></i>
                <span>Phone</span>
            </div>
            <span class="text-green-700 font-medium">
                +855 17 883 474
            </span>
        </a>
    
        <!-- Address -->
        <a href="https://maps.app.goo.gl/gWueR5ksdfC9kcch8" target="_blank"
            class="flex items-start justify-between py-2 hover:bg-gray-50 rounded transition">
            <div class="flex items-center space-x-2 text-gray-500">
                <i data-lucide="map-pin" class="w-4 h-4 mt-0.5"></i>
                <span>Address</span>
            </div>
            <span class="text-green-700 font-medium text-right">
                Royal Palace, Phnom Penh, Cambodia
            </span>
        </a>
    
    </div>
    

</div>
<!-- Activate icons -->
<script>
    lucide.createIcons();
</script>
</body>
</html>
